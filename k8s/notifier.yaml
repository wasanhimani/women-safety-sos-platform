apiVersion: apps/v1
kind: Deployment
metadata: { name: notifier, namespace: sos }
spec:
  replicas: 2
  selector: { matchLabels: { app: notifier } }
  template:
    metadata:
      labels: { app: notifier }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8001" }
    spec:
      containers:
        - name: notifier
          image: notifier:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: REDIS_URL, value: "redis://redis:6379/0" }
            - name: TELEGRAM_BOT_TOKEN
              valueFrom: { secretKeyRef: { name: telegram, key: token, optional: true } }
            - name: TELEGRAM_CHAT_ID
              valueFrom: { secretKeyRef: { name: telegram, key: chat_id, optional: true } }
          ports: [{ containerPort: 8001 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 192Mi }
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false }
