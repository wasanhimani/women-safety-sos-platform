# Service level objective: no SOS alert waits more than 5 seconds before a notifier finishes it.
# The numbers come from the queue itself (published by the API pods), so they stay accurate
# even when every notifier pod has crashed.
groups:
  - name: sos-slo
    interval: 2s
    rules:
      - alert: SOSAlertWaitingTooLong
        expr: max(sos_queue_oldest_waiting_seconds) > 5
        for: 0s
        labels: { severity: critical }
        annotations:
          summary: "An SOS alert has been waiting more than 5 seconds"

      - alert: SOSNotifierDown
        expr: (sum(up{job="notifier"} == 1) or vector(0)) < 1
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "No notifier is running, so SOS alerts are not being delivered"

      - alert: SOSAlertsBacklog
        expr: max(sos_queue_lag) > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Alerts have been waiting in the queue for over a minute"

      - alert: SOSAPIDown
        expr: (sum(up{job="sos-api"} == 1) or vector(0)) < 1
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "The SOS API is down, so no alerts can be accepted"
