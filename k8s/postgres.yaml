apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: sos }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_USER, value: sos }
            - { name: POSTGRES_DB, value: sos }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: sos-secrets, key: postgres-password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "sos", "-d", "sos"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "sos", "-d", "sos"] }
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: sos }
spec:
  clusterIP: None
  selector: { app: postgres }
  ports: [{ port: 5432 }]
