# Service level objective: 99% of SOS alerts are processed within 5 seconds of being accepted.
groups:
  - name: sos-slo
    rules:
      - record: sos:delivery_under_5s:ratio_5m
        expr: |
          sum(rate(sos_alert_delivery_seconds_bucket{le="5.0"}[5m]))
          / sum(rate(sos_alert_delivery_seconds_count[5m]))

      - alert: SOSDeliverySLOBreach
        expr: sos:delivery_under_5s:ratio_5m < 0.99
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "Fewer than 99% of SOS alerts were delivered within 5 seconds"

      - alert: SOSNotifierDown
        expr: (sum(up{job="notifier"} == 1) or vector(0)) < 1
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "No notifier is running, so SOS alerts are not being delivered"

      - alert: SOSAlertsBacklog
        expr: max(sos_queue_lag) > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Alerts have been waiting in the queue for over a minute"

      - alert: SOSAPIDown
        expr: (sum(up{job="sos-api"} == 1) or vector(0)) < 1
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "The SOS API is down, so no alerts can be accepted"
