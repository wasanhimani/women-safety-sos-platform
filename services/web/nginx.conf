server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Browser protections. The CSP only lets the page load its own files, which also limits
    # the damage if someone ever managed to inject a script.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # Pages and scripts are always re-checked so a new release is picked up straight away.
    expires -1;

    location /fonts/ { expires 30d; }
    location /icons/ { expires 7d; }

    # The browser talks only to this server; /api/... is passed on to the backend.
    location /api/ {
        proxy_pass http://sos-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    location / {
        try_files $uri /index.html;
    }
}
